<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Construction Admin Login</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

<style>
body{
font-family: 'Inter', sans-serif;
background-image: url('https://images.unsplash.com/photo-1503387762-592deb58ef4e');
background-size: cover;
background-position: center;
}

.overlay{
background: rgba(0,0,0,0.65);
}
</style>

</head>

<body>

<div class="overlay min-h-screen flex items-center justify-center">

<div class="bg-white/95 backdrop-blur-md shadow-2xl rounded-2xl p-10 w-full max-w-md border border-gray-200">

<!-- Logo -->
<div class="flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-yellow-500 text-5xl mr-2">engineering</span>
<h1 class="text-2xl font-black text-gray-800">BuildAdmin</h1>
</div>

<h2 class="text-center text-3xl font-bold text-gray-800 mb-6">
Construction Admin Portal
</h2>

{% if messages %}
<div class="mb-4 text-center">
{% for message in messages %}
<p class="text-red-500 text-sm">{{ message }}</p>
{% endfor %}
</div>
{% endif %}

<form method="POST" class="space-y-5">
{% csrf_token %}

<div>
<label class="block text-sm font-semibold text-gray-700 mb-2">
Email Address
</label>
<input type="email" name="email" required
class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-yellow-500 focus:outline-none"
placeholder="Enter your email">
</div>

<div>
<label class="block text-sm font-semibold text-gray-700 mb-2">
Password
</label>
<input type="password" name="password" required
class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-yellow-500 focus:outline-none"
placeholder="Enter your password">
</div>

<button type="submit"
class="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 rounded-lg transition duration-200 shadow-md">
Login to Dashboard
</button>

</form>

<!-- Footer -->
<p class="text-center text-gray-500 text-sm mt-6">
© 2026 Construction Management System
</p>

</div>

</div>

</body>
</html>
