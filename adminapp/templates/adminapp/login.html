<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Construction Admin Login</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

<style>
  :root {
    --yellow: #F5A623;
    --dark: #1A1A1A;
    --card: rgba(15,15,15,0.88);
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background-image: url('https://images.unsplash.com/photo-1503387762-592deb58ef4e');
    background-size: cover;
    background-position: center;
    min-height: 100vh;
    margin: 0;
  }

  .overlay {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(0,0,0,0.82) 0%, rgba(20,12,0,0.78) 100%);
    backdrop-filter: blur(2px);
  }

  .card {
    background: var(--card);
    border: 1px solid rgba(245,166,35,0.18);
    border-radius: 4px;
    padding: 48px 44px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);
    animation: fadeUp 0.5s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 32px;
  }

  .logo-icon {
    color: var(--yellow);
    font-size: 36px;
  }

  .logo-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 0.08em;
    color: #fff;
    line-height: 1;
  }

  .logo-text span {
    color: var(--yellow);
  }

  h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.38);
    margin: 0 0 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .field-label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    margin-bottom: 8px;
  }

  .field-input {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 3px;
    padding: 13px 16px;
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }

  .field-input::placeholder { color: rgba(255,255,255,0.2); }

  .field-input:focus {
    border-color: var(--yellow);
    background: rgba(245,166,35,0.05);
  }

  .field-group { margin-bottom: 20px; }

  .show-pw-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    margin-bottom: 28px;
  }

  .show-pw-row input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--yellow);
    cursor: pointer;
  }

  .show-pw-row label {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    cursor: pointer;
    user-select: none;
  }

  .btn-submit {
    width: 100%;
    background: var(--yellow);
    color: #111;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 17px;
    letter-spacing: 0.12em;
    border: none;
    border-radius: 3px;
    padding: 15px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(245,166,35,0.25);
  }

  .btn-submit:hover {
    background: #f0b93a;
    box-shadow: 0 6px 28px rgba(245,166,35,0.38);
  }

  .btn-submit:active { transform: scale(0.99); }

  .error-box {
    background: rgba(220,38,38,0.12);
    border: 1px solid rgba(220,38,38,0.3);
    border-radius: 3px;
    padding: 10px 14px;
    margin-bottom: 20px;
  }

  .error-box p {
    color: #f87171;
    font-size: 13px;
    margin: 0;
    text-align: center;
  }

  .footer-text {
    text-align: center;
    color: rgba(255,255,255,0.18);
    font-size: 12px;
    margin-top: 28px;
    letter-spacing: 0.06em;
  }
</style>
</head>

<body>
<div class="overlay">
  <div class="card">

    <!-- Logo -->
    <div class="logo-row">
      <span class="material-symbols-outlined logo-icon">engineering</span>
      <div class="logo-text">Build<span>Admin</span></div>
    </div>

    <h2>Construction Admin Portal</h2>

    <!-- Error messages (Django template) -->
    {% if messages %}
    <div class="error-box">
      {% for message in messages %}
      <p>{{ message }}</p>
      {% endfor %}
    </div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}

      <!-- Email -->
      <div class="field-group">
        <label class="field-label" for="emailInput">Email Address</label>
        <input
          type="email"
          name="email"
          id="emailInput"
          required
          class="field-input"
          placeholder="you@company.com"
        >
      </div>

      <!-- Password -->
      <div class="field-group">
        <label class="field-label" for="passwordInput">Password</label>
        <input
          type="password"
          name="password"
          id="passwordInput"
          required
          class="field-input"
          placeholder="••••••••"
        >
      </div>

      <!-- Show password toggle -->
      <div class="show-pw-row">
        <input type="checkbox" id="togglePassword">
        <label for="togglePassword">Show password</label>
      </div>

      <button type="submit" class="btn-submit">Login to Dashboard</button>
    </form>

    <p class="footer-text">© 2026 Construction Management System</p>

  </div>
</div>

<script>
  const passwordInput = document.getElementById('passwordInput');
  const togglePassword = document.getElementById('togglePassword');
  togglePassword.addEventListener('change', function () {
    passwordInput.type = this.checked ? 'text' : 'password';
  });
</script>

</body>
</html>
